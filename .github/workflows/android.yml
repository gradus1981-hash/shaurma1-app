name: Build APK

on:
  push:
    branches: ["main"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Build APK
        run: |
          cd shaurma_grill_app_android_studio_project
          cd shaurma_grill_app
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Show files
        run: |
          find . -name "*.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v6
        with:
          name: app-debug
          path: shaurma_grill_app_android_studio_project/shaurma_grill_app/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
