name: Build APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Make Gradle executable
        run: chmod +x shaurma_grill_app_android_studio_project/shaurma_grill_app/gradlew

      - name: Build debug APK
        working-directory: shaurma_grill_app_android_studio_project/shaurma_grill_app
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: shaurma_grill_app_android_studio_project/shaurma_grill_app/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
